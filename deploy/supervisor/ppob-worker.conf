# ==============================================================================
# PPOB Backend - Supervisor Queue Worker Configuration (ADR-002)
# ==============================================================================
# File ini digunakan untuk menjalankan antrean worker secara terisolasi per-supplier.
# Salin file ini ke /etc/supervisor/conf.d/ppob-worker.conf di server produksi.
# Jalankan:
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start all
# ==============================================================================

[program:ppob-worker-telkomsel]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=supplier_telkomsel --sleep=2 --tries=3 --timeout=60 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=20
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ppob-telkomsel.log
stopwaitsecs=3600

