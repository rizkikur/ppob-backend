services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ppob-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-ppob_db}
      - DB_USERNAME=${DB_USERNAME:-ppob_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ppob_net

  web:
    image: nginx:alpine
    container_name: ppob-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ppob_net

  db:
    image: postgres:16-alpine
    container_name: ppob-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ppob_db}
      POSTGRES_USER: ${DB_USERNAME:-ppob_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ppob_user} -d ${DB_DATABASE:-ppob_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ppob_net

  redis:
    image: redis:7-alpine
    container_name: ppob-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ppob_net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ppob-queue
    restart: unless-stopped
    command: php artisan queue:work redis --queue=supplier_telkomsel,supplier_indosat,supplier_xl,supplier_pln,supplier_pdam,transactions,default --sleep=2 --tries=3 --timeout=60
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-ppob_db}
      - DB_USERNAME=${DB_USERNAME:-ppob_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ppob_net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ppob-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-ppob_db}
      - DB_USERNAME=${DB_USERNAME:-ppob_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ppob_net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  ppob_net:
    driver: bridge
